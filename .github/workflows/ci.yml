name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: macod-server (typecheck + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck --workspace macod-server
      - run: npm test --workspace macod-server
      - run: cp wrangler.toml.example wrangler.toml
        working-directory: macod-server
      - run: npm run build:ci --workspace macod-server

  dashboard:
    name: macod-client-astro (typecheck + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck --workspace macod-client-astro
      - run: npm run build --workspace macod-client-astro
        env:
          PUBLIC_API_URL: http://localhost:8787
      - run: npm test --workspace macod-client-astro
        env:
          PUBLIC_API_URL: http://localhost:8787

  theme01:
    name: theme01 (astro check + test + validate + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx astro check
        working-directory: macod-astro/theme01
      - run: npm test
        working-directory: macod-astro/theme01
      - run: npm run validate:all
        working-directory: macod-astro/theme01
      - run: npm run build
        working-directory: macod-astro/theme01
